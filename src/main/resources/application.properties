spring.application.name=produtos-api
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:produtosdb}
spring.datasource.username=${DB_USER:produtos_user}
spring.datasource.password=${DB_PASSWORD:produtos_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
