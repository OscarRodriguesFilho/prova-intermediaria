spring.application.name=transacoes-api
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transacoesdb}
spring.datasource.username=${DB_USER:transacoes_user}
spring.datasource.password=${DB_PASSWORD:tasks_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
users.api.base-url=${USER_API_BASE_URL:http://localhost:8090}
