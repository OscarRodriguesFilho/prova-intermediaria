services:
  api:
    build: .
    container_name: prova-transacoes-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: transacoesdb
      DB_USER: transacoes_user
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
      USER_API_BASE_URL: ${USER_API_BASE_URL:?Defina USER_API_BASE_URL no ambiente}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: prova-transacoes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: transacoesdb
      POSTGRES_USER: transacoes_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    volumes:
      - transacoes-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transacoes_user -d transacoesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transacoes-postgres-data:
