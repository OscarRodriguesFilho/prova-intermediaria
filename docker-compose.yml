services:
  api:
    build: .
    container_name: prova-produtos-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: produtosdb
      DB_USER: produtos_user
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: prova-produtos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: produtosdb
      POSTGRES_USER: produtos_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    volumes:
      - produtos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produtos_user -d produtosdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  produtos-postgres-data:
